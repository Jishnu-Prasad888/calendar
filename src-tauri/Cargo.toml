[package]
name = "clay-calendar"
version = "0.1.0"
description = "A private Google Calendar desktop client"
authors = ["Clay Calendar contributors"]
edition = "2024"

[lib]
name = "clay_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csscolorparser = "0.8"
keyring = { version = "3", features = ["sync-secret-service", "windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
