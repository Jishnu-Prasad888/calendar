[package]
name = "clay-calendar"
version = "0.1.0"
description = "A private Google Calendar desktop client"
authors = ["Clay Calendar contributors"]
edition = "2024"

[lib]
name = "clay_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
